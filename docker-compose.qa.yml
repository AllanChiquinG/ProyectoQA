# Ambiente QA: se superpone al docker-compose.yml (dependencias) y agrega migración, API, web, proceso de mensajería y proxy.
#   docker compose -p medicore-qa --env-file .env.qa -f docker-compose.yml -f docker-compose.qa.yml up -d --build
# (o simplemente: scripts/qa.sh up). El nombre de proyecto "medicore-qa" crea volúmenes PROPIOS (medicore-qa_*): no toca los del desarrollo (medicore_*).
#
# Orden de arranque (depends_on con condiciones):
#   postgres, redis, rabbitmq (healthy) -> migrate (termina bien) -> api, worker (healthy) -> web (healthy) -> proxy
# La app Android es un APK: no es un servicio de este Compose.
name: medicore-qa

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

x-app-env: &app-env
  ASPNETCORE_ENVIRONMENT: QA
  DOTNET_ENVIRONMENT: QA
  ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-medicore};Username=${POSTGRES_USER:-medicore};Password=${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env.qa}"
  Clinic__TimeZone: ${CLINIC_TIMEZONE:-America/Guatemala}

services:
  # --- Dependencias: se reutilizan las definiciones (imagen, salud, volúmenes) del docker-compose.yml; aquí NO se publican puertos. ---
  postgres:
    ports: !reset []
    networks: [backend]
    restart: unless-stopped
    logging: *logging
  redis:
    ports: !reset []
    networks: [backend]
    restart: unless-stopped
    logging: *logging
  rabbitmq:
    ports: !reset []
    networks: [backend]
    restart: unless-stopped
    logging: *logging

  # --- Migraciones: paquete de EF Core que aplica lo pendiente y termina (idempotente). ---
  migrate:
    build: { context: ., dockerfile: docker/migrator.Dockerfile }
    image: medicore/migrator:${IMAGE_TAG:-local}
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-medicore};Username=${POSTGRES_USER:-medicore};Password=${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env.qa}"
    depends_on:
      postgres: { condition: service_healthy }
    networks: [backend]
    restart: "no"
    logging: *logging

  # --- Datos ficticios de QA (usuarios y catálogos de prueba). Solo bajo demanda: scripts/qa.sh seed ---
  seed:
    profiles: ["seed"]
    image: medicore/api:${IMAGE_TAG:-local}
    command: ["--seed-qa"]
    environment:
      <<: *app-env
      ConnectionStrings__Redis: "redis:6379,password=${REDIS_PASSWORD:?Define REDIS_PASSWORD en .env.qa}"
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Define JWT_SIGNING_KEY en .env.qa}
      Seed__DevPassword: ${SEED_DEV_PASSWORD:?Define SEED_DEV_PASSWORD en .env.qa}
      Messaging__Enabled: "false"
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [backend]
    restart: "no"
    logging: *logging

  api:
    build: { context: ., dockerfile: docker/api.Dockerfile }
    image: medicore/api:${IMAGE_TAG:-local}
    environment:
      <<: *app-env
      ConnectionStrings__Redis: "redis:6379,password=${REDIS_PASSWORD:?Define REDIS_PASSWORD en .env.qa}"
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Define JWT_SIGNING_KEY en .env.qa}
      # La mensajería corre en el contenedor "worker"; la API solo guarda el evento en el outbox (misma transacción que el dato clínico).
      Messaging__Enabled: "false"
      # Seguro porque la API no publica puertos: solo el proxy llega a ella.
      ForwardedHeaders__Enabled: "true"
      RateLimiting__AuthPermitsPerMinute: ${AUTH_PERMITS_PER_MINUTE:-10}
    volumes:
      - ./deploy/healthcheck-http.sh:/healthcheck-http.sh:ro
    healthcheck:
      test: ["CMD", "bash", "/healthcheck-http.sh", "8080", "/api/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    networks: [backend, edge]
    restart: unless-stopped
    logging: *logging

  worker:
    build: { context: ., dockerfile: docker/worker.Dockerfile }
    image: medicore/worker:${IMAGE_TAG:-local}
    environment:
      <<: *app-env
      ConnectionStrings__RabbitMq: "amqp://${RABBITMQ_DEFAULT_USER:-medicore}:${RABBITMQ_DEFAULT_PASS:?Define RABBITMQ_DEFAULT_PASS en .env.qa}@rabbitmq:5672/"
    healthcheck:
      test: ["CMD-SHELL", "test -n \"$$(find /tmp/medicore-worker.alive -mmin -1 2>/dev/null)\""]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      migrate: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }
    networks: [backend]
    restart: unless-stopped
    logging: *logging

  web:
    build: { context: ., dockerfile: docker/web.Dockerfile }
    image: medicore/web:${IMAGE_TAG:-local}
    environment:
      ASPNETCORE_ENVIRONMENT: QA
      Api__BaseUrl: http://api:8080
      Clinic__TimeZone: ${CLINIC_TIMEZONE:-America/Guatemala}
      ForwardedHeaders__Enabled: "true"
      DataProtection__KeysPath: /keys
    volumes:
      - web-keys:/keys
      - ./deploy/healthcheck-http.sh:/healthcheck-http.sh:ro
    healthcheck:
      test: ["CMD", "bash", "/healthcheck-http.sh", "8080", "/Login"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      api: { condition: service_healthy }
    networks: [edge]
    restart: unless-stopped
    logging: *logging

  proxy:
    image: caddy:2-alpine
    ports:
      - "${PROXY_HTTP_BIND:-127.0.0.1:8080}:80"
      - "${PROXY_HTTPS_BIND:-127.0.0.1:8443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_healthy }
    networks: [edge]
    restart: unless-stopped
    logging: *logging

networks:
  # Red interna: sin salida a Internet ni al anfitrión. Aquí viven las bases de datos y el broker.
  backend:
    internal: true
  edge: {}

volumes:
  web-keys:
  caddy-data:
  caddy-config:
